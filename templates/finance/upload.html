<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>baqlau — Загрузить документ</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">
    <style>
        .upload-card {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .upload-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            box-sizing: border-box;
        }

        .btn-upload-submit {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            white-space: normal !important;
            word-break: normal !important;
            overflow-wrap: break-word !important;
            text-align: center !important;
            padding: 12px 16px !important;
            font-size: 0.92rem !important;
            line-height: 1.35 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
        }

        @media (max-width: 640px) {
            .main-content--centered {
                padding: 16px 12px 80px 12px !important;
            }

            .upload-card {
                padding: 24px 16px !important;
                max-width: 100% !important;
                border-radius: 20px !important;
            }

            .upload-icon {
                width: 64px !important;
                height: 64px !important;
                line-height: 64px !important;
                font-size: 2.2rem !important;
                margin-bottom: 12px !important;
            }

            .upload-title {
                font-size: 1.25rem !important;
                margin-bottom: 6px !important;
            }

            .upload-subtitle {
                font-size: 0.8rem !important;
                margin-bottom: 20px !important;
            }

            .file-input-label {
                padding: 12px 14px !important;
                font-size: 0.85rem !important;
            }

            .btn-upload-submit {
                font-size: 0.86rem !important;
                padding: 11px 12px !important;
            }
        }
    </style>
</head>

<body>


    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar__inner">
            <a href="{% url 'dashboard' %}" class="navbar__logo">
                🏦 <span>baqlau</span>
            </a>
            <div class="navbar__right">
                <!-- Streak (gamification) -->
                <div class="streak-badge" title="Ваш стрик — заходите каждый день, чтобы не потерять!">
                    <span class="streak-badge__emoji">🔥</span>
                    <span id="streak-count">7</span><span class="streak-badge__label"> дней</span>
                </div>

                <!-- Theme toggle -->
                <button class="theme-toggle" id="theme-toggle" title="Переключить тему" aria-label="Переключить тему">
                    <span id="theme-icon">🌙</span>
                </button>

                <!-- User avatar & Logout -->
                <div class="navbar__user-group" style="display: flex; align-items: center; gap: 8px;">
                    <span class="navbar__user-name" style="font-size: 0.9rem; font-weight: 600;">{{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" style="display: inline; margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="btn-link navbar__logout-link"
                            style="border: none; background: none; cursor: pointer; font-size: 0.8rem; padding: 2px 4px;"
                            title="Выйти из аккаунта">
                            <span class="navbar__logout-text">Выйти</span>
                            <span class="navbar__logout-icon" style="display: none;">🚪</span>
                        </button>
                    </form>
                    <div class="avatar" title="Профиль пользователя" aria-label="Профиль">
                        {{user.username|slice:":1"|upper}}</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content main-content--centered">
        <div class="upload-card">
            <div class="upload-icon">📄</div>
            <h1 class="upload-title">Загрузить документ</h1>
            <p class="upload-subtitle">Поддерживаемые форматы: PDF, JPG, PNG</p>

            {% if error %}
            <div class="alert-error">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="upload-form">
                {% csrf_token %}

                <div class="file-input-wrapper">
                    <input type="file" name="document" id="file-upload" class="file-input" required
                        accept=".pdf,.jpg,.jpeg,.png">
                    <label for="file-upload" class="file-input-label">
                        <span style="font-size: 1.2rem; flex-shrink: 0;">📁</span>
                        <span id="file-label-text">Выберите файл на устройстве</span>
                    </label>
                    <div id="file-name" class="file-name-display"></div>
                </div>

                <button type="submit" class="btn-tonal btn-tonal--primary btn-upload-submit">
                    ✨ Распознать чек с помощью ИИ
                </button>
            </form>

            <a href="{% url 'dashboard' %}" class="btn-link">← Вернуться к дашборду</a>
        </div>
    </main>

    <!-- ============================================================
    MOBILE BOTTOM NAVIGATION
    ============================================================ -->
    <nav class="mobile-bottom-nav" aria-label="Мобильная навигация">
        <a href="{% url 'dashboard' %}" class="mobile-nav-item">
            <span class="mobile-nav-icon">📊</span>
            <span class="mobile-nav-label">Дашборд</span>
        </a>
        <a href="{% url 'transactions' %}" class="mobile-nav-item">
            <span class="mobile-nav-icon">📈</span>
            <span class="mobile-nav-label">Транзакции</span>
        </a>
        <a href="{% url 'upload' %}" class="mobile-nav-item mobile-nav-item--fab active" title="Добавить чек">
            <span class="mobile-nav-fab">+</span>
            <span class="mobile-nav-label">Чек</span>
        </a>
        <a href="{% url 'chatbot' %}" class="mobile-nav-item">
            <span class="mobile-nav-icon">🤖</span>
            <span class="mobile-nav-label">AI Чат</span>
        </a>
    </nav>


    <script>
        /* ── THEME TOGGLE ─────────────────────────────────────────── */
        const root = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('baqlau-theme', theme);
        }

        (function initTheme() {
            const saved = localStorage.getItem('baqlau-theme');
            if (saved) {
                applyTheme(saved);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }
        })();

        themeToggle.addEventListener('click', function () {
            const current = root.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        /* ── STREAK COUNTER (sync with dashboard) ──────────────────── */
        (function initStreak() {
            const streak = parseInt(localStorage.getItem('baqlau-streak') || '0', 10);
            document.getElementById('streak-count').textContent = streak || 1;
        })();

        /* ── FILE INPUT FEEDBACK ───────────────────────────────────── */
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const fileLabelText = document.getElementById('file-label-text');

        fileInput.addEventListener('change', function () {
            if (this.files && this.files.length > 0) {
                fileNameDisplay.textContent = `Выбран файл: ${this.files[0].name}`;
                fileLabelText.textContent = 'Выбрать другой';
            } else {
                fileNameDisplay.textContent = '';
                fileLabelText.textContent = 'Выберите файл на устройстве';
            }
        });
    </script>
</body>

</html>
